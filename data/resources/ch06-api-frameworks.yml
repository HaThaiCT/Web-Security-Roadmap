  primary_topic: payments-workflows
  related_topics: [webhooks-saas, business-logic, secure-design]
  tier: core
  annotation: >-
    A comprehensive security baseline for integrating third-party payment gateways.
    It covers PCI-DSS scope reduction through client-side tokenization and hosted fields,
    mandates server-side validation of transaction amounts and currency codes, details
    cryptographic verification of asynchronous gateway callbacks, and enforces state machine
    integrity to prevent payment status tampering.
  cost: free
  access: public
