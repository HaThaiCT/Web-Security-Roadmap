- id: owasp-grpc-security-cheat-sheet
  title: gRPC Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/gRPC_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [tester, developer]
  primary_topic: grpc-soap
  related_topics: [rest-openapi, distributed-components, hardening-defaults]
  tier: core
  annotation: >-
    A practical security guide for gRPC microservices and APIs. It details transport
    security requirements including mutual TLS (mTLS), token and metadata authentication
    via interceptors, message-level authorization, Protocol Buffer validation boundaries
    (clarifying that Protobuf enforces types but not business invariants), message size limits,
    and disabling server reflection in production.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English gRPC security guidance inspected; no RPC calls executed.
    evidence: >-
      The inspected cheat sheet mandates TLS and recommends mTLS for zero-trust service communication,
      covers interceptor-based JWT/API key validation, explains that Protobuf provides type safety
      rather than business validation, requires max message size limits to prevent DoS, recommends
      per-client rate limiting and timeouts, and advises disabling gRPC reflection in production.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: null

- id: owasp-web-frontend-security-cheat-sheet
  title: Web Frontend Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Web_Frontend_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: frontend-bff
  related_topics: [rendering-architectures, xss, identity-mechanics]
  tier: core
  annotation: >-
    A focused security guide for modern frontend architectures, Single Page Applications (SPA),
    and asynchronous browser-backend communication. It establishes a zero-trust mindset for all data
    flowing between client and server, covers safe DOM rendering (preventing innerHTML XSS sinks),
    secure state management in memory vs. storage, and architectural patterns for decoupling API tokens
    from frontend clients via Backend-for-Frontend (BFF) layers.
  cost: free
  access: public
  archive_url: null
