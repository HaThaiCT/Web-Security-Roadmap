    evidence: >-
      The inspected cheat sheet establishes PCI-DSS scope reduction via iframe/tokenization,
      prohibits trusting client-submitted prices or payment statuses, requires verifying signatures
      on asynchronous server-to-server callbacks and webhooks, and outlines secure payment state
      transitions and idempotency controls.
