- id: owasp-rest-security-cheat-sheet
  title: REST Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences:
  - tester
  - developer
  primary_topic: rest-openapi
  related_topics:
  - jwt
  - oauth-oidc
  - cors
  - logging-detection
  - security-testing
  tier: core
  annotation: A practical checklist for REST services covering HTTPS, authentication, local authorization, JWT validation, API keys, input/content-type validation, status codes, CORS, rate limiting and audit logging. It is a good bridge from general web vulnerabilities to API-specific implementation and review work.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English REST security sections inspected; no API requests sent.
    evidence: The inspected content requires HTTPS-only endpoints, local access control on non-public APIs, central IdP access tokens, rejecting unsigned JWTs, verifying iss/aud/exp/nbf, denylisting jti on logout, not relying exclusively on API keys, validating length/range/format/type, rejecting oversized payloads, avoiding stack traces and logging token-validation failures.
  provenance:
    origin: additional-research
    upstream_ids: []
