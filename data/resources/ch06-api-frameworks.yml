- id: stripe-webhook-security-guide
  title: Stripe Webhook Signatures & Security
  url: https://stripe.com/docs/webhooks
  author: Stripe Developer Documentation
  type: documentation
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: webhooks-saas
  related_topics: [payments-workflows, applied-crypto, rest-openapi]
  tier: core
  annotation: >-
    An industry-standard implementation guide for securing incoming webhook endpoints.
    It details cryptographic HMAC signature verification (Stripe-Signature header) computed
    over the unparsed raw request payload, replay attack defense using signed timestamps
    and tolerance windows, constant-time comparison to prevent timing leaks, and idempotency
    to safely process duplicate events.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English webhook signature verification documentation inspected; no live webhooks triggered.
    evidence: >-
      The inspected documentation details HMAC-SHA256 signature verification over raw request
      payload bytes, validates the timestamp component against replay tolerance windows (default 5 minutes),
      recommends constant-time string comparison algorithms, and prescribes idempotent event handling
      based on event IDs.
  provenance:
    origin: additional-research
    upstream_ids: []

- id: owasp-payment-gateway-integration-cheat-sheet
  title: Third Party Payment Gateway Integration Cheat Sheet
