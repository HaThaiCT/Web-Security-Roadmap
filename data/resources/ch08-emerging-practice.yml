- id: owasp-top-10-for-llm-applications
  title: OWASP Top 10 for Large Language Model Applications
  url: https://genai.owasp.org/llm-top-10/
  author: OWASP Gen AI Security Project
  type: documentation
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: ai-web-security
  related_topics: [rag-isolation, information-errors, threat-modeling]
  tier: core
  annotation: >-
    The premier risk taxonomy and awareness standard for applications integrating
    Large Language Models. It defines critical failure modes including direct and
    indirect prompt injection, sensitive data leakage, improper output handling,
    excessive agency, and vector/embedding vulnerabilities, providing core security
    principles for AI-enabled web features.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English 2025 risk list and mitigation definitions inspected; no model APIs invoked.
    evidence: >-
      The inspected standard details ten core LLM risks (LLM01 to LLM10: Prompt
      Injection, Sensitive Information Disclosure, Supply Chain, Data/Model Poisoning,
      Improper Output Handling, Excessive Agency, System Prompt Leakage, Vector/Embedding
      Weaknesses, Misinformation, Unbounded Consumption), distinguishes direct vs.
      indirect injection, and outlines defenses including input/output validation,
      least agency, and rate limits.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: '2025 Edition published by the OWASP Gen AI Security Project.'

- id: xs-leaks-wiki
  title: XS-Leaks Wiki
  url: https://xsleaks.dev/
  author: XS-Leaks Research Community
  type: documentation
  language: en
  difficulty: advanced
  audiences: [tester, developer]
  primary_topic: side-channels
  related_topics: [privacy-leakage, browser-internals, origins-cookies]
  tier: core
  annotation: >-
    The definitive knowledge base on Cross-Site Leaks (XS-Leaks) and web browser side channels.
    It details how attackers infer sensitive user data across origins without directly violating
    the Same-Origin Policy, analyzing timing attacks, frame counting, error events, navigation
    timing, and cache probing, while outlining defense-in-depth protections including Fetch Metadata,
    COOP, and CORP.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English XS-Leaks concept, attack, and defense wiki sections inspected; no timing probes executed.
    evidence: >-
      The inspected wiki details XS-Leaks principles, documents cross-site search (XS-Search)
      exploiting network and execution timing oracles, analyzes browser state leakage via window.length
      (frame counting) and error events, and outlines modern browser defenses: Sec-Fetch-Site and
      Fetch Metadata headers, Cross-Origin-Opener-Policy (COOP), Cross-Origin-Resource-Policy (CORP),
      and SameSite cookies.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: null

- id: owasp-rag-security-cheat-sheet
  title: RAG Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/RAG_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: rag-isolation
  related_topics: [ai-web-security, tenant-isolation, secure-design]
  tier: core
  annotation: >-
    An authoritative reference for securing Retrieval-Augmented Generation (RAG) pipelines in enterprise AI applications.
    It details how RAG redistributes attack surfaces across document ingestion, embedding generation, vector storage,
    and response generation; establishes access control metadata on individual vector chunks; mandates tenant and
    data classification isolation in vector databases; and outlines query normalization and output validation controls.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English RAG pipeline and vector store security guidance inspected; no embeddings generated.
    evidence: >-
      The inspected cheat sheet establishes foundational defenses for RAG architectures; mandates binding access
      control metadata to every chunk; requires strict tenant and classification isolation within vector stores;
      details context window delimiter protections against indirect prompt injection; and outlines fail-closed pipeline controls.
  provenance:
    origin: additional-research
    upstream_ids: []

