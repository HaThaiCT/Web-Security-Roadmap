- id: portswigger-http-request-smuggling-reborn
  title: 'HTTP Desync Attacks: Request Smuggling Reborn'
  url: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  author: James Kettle (PortSwigger)
  type: article
  language: en
  difficulty: advanced
  audiences: [learner, tester, developer]
  primary_topic: http-smuggling
  related_topics: [distributed-components, web-server-proxies, web-caching]
  tier: core
  annotation: >-
    Foundational research on HTTP request smuggling against modern multi-tier
    web architectures. It explains CL.TE, TE.CL, and obfuscated Transfer-Encoding
    desynchronization between front-end reverse proxies and back-end servers,
    providing non-destructive detection probes and architectural mitigations
    including end-to-end HTTP/2 and request normalization.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English research article and methodology sections inspected; no exploit payloads sent to external systems.
    evidence: >-
      The inspected paper details CL.TE and TE.CL desync mechanisms where proxy and
      backend disagree on request boundary delimiters, obfuscation variants in TE
      headers, severe real-world impacts (credential hijacking, cache poisoning,
      request reflection), a four-stage Detect-Confirm-Explore-Exploit methodology,
      and defenses including HTTP/2 backends, disabling connection reuse, and strict
      request normalization.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: 'Published August 2019; presented at Black Hat USA 2019 and DEF CON 27.'

- id: owasp-web-cache-security-cheat-sheet
  title: Web Cache Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Web_Cache_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: web-caching
  related_topics: [web-server-proxies, distributed-components, headers-redirects]
  tier: core
  annotation: >-
    A comprehensive defensive guide on preventing sensitive response exposure,
    web cache poisoning, and web cache deception. It defines cache key mechanics,
    unkeyed input hazards, delimiter and path confusion, and specifies rigorous
    defenses including Cache-Control: no-store, private directives, and Content-Type
    validation.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English web cache security sections inspected; no cache probes sent.
    evidence: >-
      The inspected cheat sheet distinguishes cache poisoning (injecting payloads via
      unkeyed inputs into shared responses) from cache deception (tricking caches into
      storing authenticated user responses via path confusion), and recommends defensive
      rules: route-based cache policies, strict Cache-Control directives, matching URL
      extensions to response Content-Type, and canonicalizing cache keys.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: null

