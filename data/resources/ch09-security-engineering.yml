- id: owasp-threat-modeling-cheat-sheet
  title: Threat Modeling Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [developer, tester]
  primary_topic: threat-modeling
  related_topics: [secure-design, security-requirements, testing-methodology]
  tier: core
  annotation: >-
    A structured guide to integrating threat modeling across the software development
    lifecycle. Grounded in the Threat Modeling Manifesto's four core questions (What
    are we working on? What can go wrong? What are we going to do about it? Did we
    do a good enough job?), it details system decomposition via Data Flow Diagrams
    (DFDs), threat identification using STRIDE per element, and risk mitigation
    strategies.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English threat modeling cheat sheet sections inspected; no external threat model files processed.
    evidence: >-
      The inspected cheat sheet structures threat modeling around the four manifesto
      questions, details application decomposition via Data Flow Diagrams (DFDs),
      explores STRIDE (Spoofing, Tampering, Repudiation, Information Disclosure, Denial
      of Service, Elevation of Privilege) mapped to desirable security attributes,
      outlines responses (Mitigate, Eliminate, Transfer, Accept), and aligns with
      NIST SP 800-218 and ASVS.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: null

- id: owasp-secure-product-design-cheat-sheet
