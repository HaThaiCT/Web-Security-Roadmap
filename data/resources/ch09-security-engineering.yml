- id: mdn-practical-security-implementation-guides
  title: Practical security implementation guides
  url: https://developer.mozilla.org/en-US/docs/Web/Security/Practical_implementation_guides
  author: MDN contributors
  type: documentation
  language: en
  difficulty: intermediate
  audiences: [developer, tester]
  primary_topic: hardening-defaults
  related_topics:
    - dns-tls
    - sessions
    - csrf
    - cors
    - csp-clickjacking
    - privacy-leakage
    - secure-design
    - security-requirements
  tier: core
  annotation: >-
    A developer-facing index of practical web security controls, especially
    transport security and browser-facing headers. It is valuable as a bridge
    between vulnerability knowledge and implementation because it prioritizes
    controls such as HTTPS resource loading, HTTPS redirection, HSTS,
    clickjacking prevention, secure cookies, CORS, CSP, Referrer-Policy and
    Subresource Integrity. Treat it as an implementation checklist and then
    read the linked deep guides for each control.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Public English index page and control table inspected; linked sub-guides not exhaustively inspected in this batch.
    evidence: >-
      The inspected page links practical guides to Mozilla HTTP Observatory,
      orders controls by recommended priority, and identifies TLS
      configuration/resource loading/redirection, HSTS, clickjacking
      prevention, CSRF prevention, secure cookies, CORP, CSP, CORS,
      Referrer-Policy, robots.txt and SRI with impact/difficulty metadata.
  provenance:
    origin: additional-research
