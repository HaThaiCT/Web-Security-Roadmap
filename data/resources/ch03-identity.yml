    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English JWT cheat-sheet sections inspected; no exploit tokens generated.
    evidence: The inspected cheat sheet details JWT structure, warns against algorithm confusion (using public keys as HMAC secrets), unsecured tokens (alg none), trusting key material in token headers (jwk, jku, x5u, kid), issuer/audience confusion, and details defensive patterns including strict algorithm allowlisting, separate verification keys, and token revocation via Token Status Lists.
