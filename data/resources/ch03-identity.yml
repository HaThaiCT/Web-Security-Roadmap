  tier: core
  annotation: >-
    An authoritative reference for designing, implementing, and assessing multifactor
    authentication (MFA). It analyzes the five recognized authentication factor types,
    ranks factor security (contrasting phishing-resistant FIDO2/WebAuthn with restricted SMS/voice
    channels), details attack patterns like MFA fatigue and adversary-in-the-middle reverse proxies,
    and defines strict requirements for high-risk factor resets and step-up authentication.
