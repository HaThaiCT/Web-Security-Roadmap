- id: portswigger-saml-authentication-bypasses
  title: 'The Fragile Lock: Novel Bypasses For SAML Authentication'
  url: https://portswigger.net/research/the-fragile-lock
  author: PortSwigger Research
  type: article
  language: en
  difficulty: advanced
  audiences:
  - tester
  - developer
  primary_topic: saml-scim
  related_topics:
  - parsing-templates
  - tenant-isolation
  - practice-labs
  tier: core
  annotation: Cutting-edge security research on SAML 2.0 implementations demonstrating full authentication bypasses via XML Signature Wrapping (XSW), attribute pollution, namespace confusion, and Void Canonicalization. It analyzes parser desynchronization between signature verification and assertion consumer modules (e.g. Nokogiri vs REXML) and details how empty digest strings lead to universal token forgery.
  cost: free
  access: public
  archive_url: null
  version_context: 'Published December 2025 by PortSwigger Research.'
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English SAML research paper and technical write-up inspected; no authentication bypasses executed.
    evidence: The inspected research details XML Signature Wrapping against Ruby-SAML and PHP-SAML, reveals dual-parser desynchronization where Nokogiri and REXML resolve conflicting XPath attributes, explores namespace-based signature hiding, and documents Void Canonicalization where libxml2 errors cause empty string hashing (SHA-256 digest 47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=), enabling arbitrary assertion forgery.
  provenance:
    origin: additional-research
    upstream_ids: []
