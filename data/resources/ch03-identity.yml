- id: owasp-oauth2-cheat-sheet
  title: OAuth2 Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/OAuth2_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: advanced
  audiences:
  - tester
  - developer
  primary_topic: oauth-oidc
  related_topics:
  - jwt
  - sessions
  - csrf
  - authorization-idor
  tier: core
  annotation: A compact security baseline for OAuth 2.x and OIDC deployments. It prioritizes Authorization Code with PKCE, strict redirect handling, state/nonce, token binding/rotation and resource-server validation. Read it after core authentication and sessions; OAuth is a delegation protocol, not a generic login shortcut.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English OAuth2 guidance inspected; no code executed.
    evidence: The inspected content recommends Authorization Code with PKCE for all client types, deprecates implicit grant, requires downgrade-resistant PKCE handling, warns against arbitrary redirect forwarding and HTTP redirect URIs except loopback native-client cases, explains state/nonce CSRF handling, and requires resource servers to validate token audience and scopes/actions on every request.
  provenance:
    origin: additional-research
    upstream_ids: []
- id: owasp-json-web-token-cheat-sheet
  title: JSON Web Token Cheat Sheet
