    evidence: >-
      The inspected cheat sheet structures authentication into 5 factor categories, highlights
      FIDO2/WebAuthn as phishing-resistant by binding credentials to the browser origin, notes
      NIST SP 800-63B deprecation of SMS/phone channels and security questions, addresses MFA fatigue
      via number matching and rate limiting, and mandates out-of-band notifications and re-authentication
      for MFA resets and factor modification.
