- id: owasp-transport-layer-security-cheat-sheet
  title: Transport Layer Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: dns-tls
  related_topics: [web-standards, hardening-defaults, web-server-proxies]
  tier: core
  annotation: >-
    An authoritative reference for securing transport encryption across modern web
    architectures. It mandates TLS 1.3 and 1.2 with AEAD cipher suites, explains the formal
    deprecation of TLS 1.0 and 1.1 (RFC 8996), covers Forward Secrecy (ECDHE), and details
    deployment controls including HTTP Strict Transport Security (HSTS), CAA DNS records,
    and disabling insecure renegotiation and compression.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English TLS configuration and hardening sections inspected; no network probes executed.
    evidence: >-
      The inspected cheat sheet documents protocol version requirements (TLS 1.2/1.3 mandatory;
      SSLv2/v3 and TLS 1.0/1.1 disabled per RFC 8996), AEAD cipher suites (AES-GCM, ChaCha20-Poly1305),
      ephemeral Diffie-Hellman key exchange for forward secrecy, disabling TLS compression (CRIME defense),
      HSTS policy configuration with preload and subdomains, and DNS Certificate Authority Authorization (CAA).
  provenance:
    origin: additional-research
    upstream_ids: []

- id: owasp-cryptographic-storage-cheat-sheet
  title: Cryptographic Storage Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: applied-crypto
  related_topics: [passwords-recovery, storage-secrets, secure-design]
  tier: core
  annotation: >-
    A practical guide for implementing secure data storage encryption in web backends.
    It establishes standards for authenticated encryption (AEAD like AES-GCM), key separation,
    cryptographically secure pseudorandom number generators (CSPRNG), and distinguishes
    reversible data encryption from memory-hard password hashing (Argon2id, scrypt, bcrypt).
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English cryptographic storage guidance inspected; no keys generated.
    evidence: >-
      The inspected cheat sheet mandates authenticated encryption (AES-GCM, ChaCha20-Poly1305),
      prohibits unauthenticated modes like CBC and ECB, requires CSPRNG for IVs and nonces,
      enforces key separation (never reusing keys across distinct contexts or algorithms),
      mandates key rotation and secure key lifecycle management, and requires password hashing
      using Argon2id, scrypt, or bcrypt rather than general encryption algorithms.
  provenance:
    origin: additional-research
    upstream_ids: []

- id: unicode-tr36-security-considerations
  title: Unicode Security Considerations (UTR #36)
  url: https://www.unicode.org/reports/tr36/tr36-15.html
  author: Mark Davis, Michel Suignard (Unicode Consortium)
  type: specification
  language: en
  difficulty: advanced
  audiences: [tester, developer]
  primary_topic: encoding-parsing
  related_topics: [web-standards, secure-code-review]
  tier: core
  annotation: >-
    The canonical technical specification addressing security hazards introduced by internationalized
    text and character encoding in software. It details visual spoofing (confusable glyphs across
    scripts), non-shortest form UTF-8 decoding vulnerabilities, buffer length expansion risks
    during casing and normalization (e.g. NFKC), and the non-compositionality of Unicode normalization
    that creates bypasses in security gatekeepers.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English Unicode security sections inspected; no code executed.
    evidence: >-
      The inspected specification analyzes visual confusable spoofing across Cyrillic, Latin,
      and Greek alphabets; documents the historical security impact of non-shortest form UTF-8
      bypassing syntax checks; explains buffer expansion hazards (up to 18x during NFKC normalization);
      and demonstrates why normalization must occur before security validation due to non-compositionality
      and character deletion vulnerabilities.
  provenance:
    origin: additional-research
    upstream_ids: []

- id: rfc9110-http-security-considerations
  title: 'RFC 9110: HTTP Semantics — Section 17 Security Considerations'
  url: https://www.rfc-editor.org/rfc/rfc9110.html
  author: R. Fielding, M. Nottingham, J. Reschke (IETF HTTP Working Group)
  type: specification
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: web-standards
  related_topics: [http, web-server-proxies, distributed-components]
  tier: core
  annotation: >-
    The definitive IETF standard defining the core semantics of the Hypertext Transfer Protocol.
    Section 17 provides an authoritative security breakdown of establishing authority (DNS/TLS
    vs. plaintext HTTP), the risks of intermediary proxies and gateways, header parsing hazards,
    handling oversized protocol elements, and sensitive information leakage in URIs, Referer headers,
    and server software identifiers.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English RFC 9110 Section 17 security considerations inspected; no network probes executed.
    evidence: >-
      The inspected specification establishes authority mechanisms for http vs. https schemes;
      warns that uncoordinated intermediaries are indistinguishable from on-path attackers;
      specifies that servers must respond with 4xx errors rather than silently ignoring oversized
      headers to prevent request smuggling; and analyzes privacy leaks in Referer headers and URI query parameters.
  provenance:
    origin: additional-research
    upstream_ids: []
