- id: mdn-http-overview
  title: Overview of HTTP
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview
  author: MDN contributors
  type: documentation
  language: en
  difficulty: beginner
  audiences:
  - learner
  - tester
  - developer
  primary_topic: http
  related_topics:
  - request-lifecycle
  - distributed-components
  - origins-cookies
  tier: core
  annotation: A clear baseline for understanding HTTP as an application-layer, client-initiated request/response protocol. It explains messages, methods, headers, intermediaries, statelessness, cookies, persistent connections and HTTP/2 framing, which are prerequisites for nearly every web security topic in this repository. Use it before studying browser state, authorization bugs, cache behavior or protocol parsing flaws.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English overview sections inspected; no code executed.
    evidence: The page describes HTTP requests and responses as discrete messages, lists common methods and headers, explains that HTTP is stateless but sessions are commonly restored with cookies, and contrasts HTTP/1.0, HTTP/1.1 persistent connections and HTTP/2 multiplexing.
  provenance:
    origin: additional-research
