- id: portswigger-smashing-the-state-machine
  title: 'Smashing the state machine: the true potential of web race conditions'
  url: https://portswigger.net/research/smashing-the-state-machine
  author: James Kettle (PortSwigger)
  type: article
  language: en
  difficulty: advanced
  audiences: [learner, tester, developer]
  primary_topic: race-conditions
  related_topics: [integrations-concurrency, business-logic, practice-labs]
  tier: core
  annotation: >-
    Groundbreaking research demonstrating novel web race condition classes beyond
    basic limit-overruns, introducing the HTTP/2 single-packet attack to eliminate
    network jitter and synchronize requests within sub-millisecond windows. It covers
    multi-endpoint collisions, transient sub-states, and database-level atomic
    defensive architecture.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English research paper and methodology sections inspected; no live targets tested.
    evidence: >-
      The inspected paper details the single-packet attack utilizing HTTP/2 frames and
      Nagle's algorithm to complete requests within a ~1ms window, explores multi-endpoint
      collisions on shared state (e.g. email change race conditions), outlines a
      Predict-Probe-Prove methodology, and establishes defensive requirements including
      database transactions, datastore integrity constraints, and avoiding mixed-source state.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: 'Published August 2023; presented at Black Hat USA 2023 and DEF CON 31.'

- id: owasp-nosql-security-cheat-sheet
  title: NoSQL Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/NoSQL_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: sql-nosql
  related_topics: [data-components, secure-code-review, security-testing]
  tier: core
  annotation: >-
    A practical defensive guide addressing NoSQL injection risks across document
    and key-value datastores like MongoDB and CouchDB. It breaks down operator
    injection ($ne, $gt, $regex), server-side JavaScript execution via $where,
    and details core defenses including strict type casting, disallowing client-supplied
    operator objects, and using safe driver query builders.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English NoSQL security sections inspected; no database queries executed.
    evidence: >-
      The inspected cheat sheet documents dangerous string-based query assembly and
      eval() patterns in Node.js/MongoDB, explains operator injection via client-supplied
      JSON fragments or query-string brackets, warns against $where server-side script
      execution, and prescribes defensive controls: rejecting keys starting with $,
      strict schema validation (Joi/Zod), type enforcement, and driver parameterization.
  provenance:
    origin: additional-research
    upstream_ids: []
  archive_url: null
  version_context: null

