- id: mdn-web-storage-api
  title: Web Storage API
  url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API
  author: MDN contributors
  type: documentation
  language: en
  difficulty: beginner
  audiences: [learner, tester, developer]
  primary_topic: identity-mechanics
  related_topics: [origins-cookies, sessions, jwt]
  tier: core
  annotation: >-
    The definitive browser documentation for client-side state storage mechanisms: localStorage
    and sessionStorage. It details origin-partitioned storage boundaries, contrasts tab-scoped
    ephemeral storage with persistent storage, analyzes synchronous performance implications,
    and establishes security boundaries—emphasizing that Web Storage is fully accessible to
    JavaScript and must never store sensitive session tokens or secrets vulnerable to XSS.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English Web Storage API documentation inspected; no scripts executed.
    evidence: >-
      The inspected documentation details localStorage vs. sessionStorage persistence models;
      explains origin isolation (scheme, host, port); notes synchronous main-thread blocking;
      and explicitly warns that Web Storage is vulnerable to XSS credential theft, recommending
      HttpOnly cookies for sensitive session tokens.
  provenance:
    origin: additional-research
    upstream_ids: []

