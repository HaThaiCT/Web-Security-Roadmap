- id: the-twelve-factor-app
  title: The Twelve-Factor App
  url: https://12factor.net/
  author: Adam Wiggins (Heroku co-founder)
  type: documentation
  language: en
  difficulty: beginner
  audiences: [learner, tester, developer]
  primary_topic: build-deploy-basics
  related_topics: [storage-secrets, cloud-iam, containers-kubernetes]
  tier: core
  annotation: >-
    The foundational architectural methodology for building software-as-a-service and cloud-native
    web applications. It establishes essential architectural boundaries: separating configuration
    from code (environment variables), treating backing services (databases, queues, caches) as
    attached resources, strictly isolating build/release/run stages, and executing applications as
    stateless processes.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English Twelve-Factor App principles inspected; no apps deployed.
    evidence: >-
      The inspected methodology mandates storing deployment configuration in environment variables
      (Factor III); treating databases, caches, and queues as attached interchangeable resources
      (Factor IV); strictly separating the build, release, and run pipeline stages (Factor V); and
      running application processes statelessly (Factor VI).
  provenance:
    origin: additional-research
    upstream_ids: []
