- id: mdn-http-caching
  title: HTTP caching
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching
  author: MDN contributors
  type: documentation
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: distributed-components
  related_topics: [web-caching, http, request-lifecycle]
  tier: core
  annotation: >-
    A foundational architectural reference detailing HTTP cache hierarchies, freshness
    lifecycles, validation mechanics, and directive semantics. It distinguishes private
    client caches from shared proxy/CDN caches, breaks down Cache-Control directives (no-store,
    no-cache, max-age, must-revalidate), explains conditional validation via ETag and
    Last-Modified, and covers cache key differentiation using the Vary header.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English HTTP caching documentation sections inspected; no network probes executed.
    evidence: >-
      The inspected content defines private vs. shared (proxy, CDN, managed) cache roles,
      details freshness calculation and age headers, contrasts no-store (preventing storage)
      with no-cache (mandatory revalidation), covers conditional validation requests using ETag
      and If-None-Match returning 304 Not Modified, explains the Vary header for response differentiation,
      and documents request collapsing and cache-busting strategies.
  provenance:
    origin: additional-research
    upstream_ids: []

- id: owasp-database-security-cheat-sheet
  title: Database Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Database_Security_Cheat_Sheet.html
  author: OWASP Cheat Sheet Series contributors
  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: data-components
  related_topics: [sql-nosql, storage-secrets, backend-integrations]
  tier: core
  annotation: >-
    An architectural guide for securing backend database instances in web applications.
    It details database isolation on dedicated network segments, least-privilege application
    accounts (limiting permissions to SELECT/INSERT/UPDATE rather than administrative superusers),
    host-based access controls, and mandating TLS 1.2+ encryption in transit between application
    servers and database instances.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English database security sections inspected; no queries executed.
    evidence: >-
      The inspected cheat sheet establishes network isolation for database servers, prohibits
      direct client connections, mandates least-privilege service accounts (recommending SELECT,
      UPDATE, DELETE over root/sa/SYS), and requires encrypted database connections using TLS 1.2+
      with AEAD ciphers and client certificate verification.
  provenance:
    origin: additional-research
    upstream_ids: []

- id: owasp-xml-security-cheat-sheet
  title: XML Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/XML_Security_Cheat_Sheet.html
