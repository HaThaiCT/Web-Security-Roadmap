  type: cheatsheet
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: parsing-templates
  related_topics: [xxe, grpc-soap, secure-design]
  tier: core
  annotation: >-
    An authoritative reference for secure XML parsing, document processing, and schema validation.
    It details parser configurations that disable Document Type Definitions (DTDs), mitigates entity
    expansion attacks (Billion Laughs exponential expansion and quadratic blowup), and defines
    strict schema validation rules using bounded enumerations and length constraints.
  cost: free
