- id: mdn-client-server-overview
  title: Client-Server overview
  url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview
  author: MDN contributors
  type: documentation
  language: en
  difficulty: beginner
  audiences: [learner, tester, developer]
  primary_topic: request-lifecycle
  related_topics: [http, rendering-architectures, data-components]
  tier: core
  annotation: >-
    A beginner-friendly architecture baseline for how browsers, web servers,
    web applications, templates, databases and static assets interact during a
    request. It is useful before studying vulnerabilities because it gives
    learners a concrete path for tracing user input from URL or form data into
    application code, database queries and rendered responses.
  cost: free
  access: public
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English client-server overview sections inspected; no code executed.
    evidence: >-
      The inspected content explains HTTP request methods and response status
      examples, URL parameters, POST body data and cookies; contrasts static and
      dynamic sites; and gives a seven-step dynamic request sequence where the
      web server forwards a request to application code, the application queries
      a database, renders a template and returns HTML before the browser loads
      static CSS and JavaScript assets.
  provenance:
    origin: additional-research
