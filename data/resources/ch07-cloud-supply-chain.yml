- id: aws-ec2-imdsv2-guide
  title: Configuring the Instance Metadata Service (IMDSv2)
  url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
  author: Amazon Web Services
  type: documentation
  language: en
  difficulty: intermediate
  audiences: [learner, tester, developer]
  primary_topic: metadata-serverless
  related_topics: [cloud-iam, ssrf, storage-secrets]
  tier: core
  annotation: >-
    Authoritative cloud documentation detailing the security architecture of AWS EC2
    Instance Metadata Service Version 2 (IMDSv2). It explains how session-oriented requests,
    mandatory PUT token generation, custom header requirements, and IP-level hop limit restrictions
    mitigate Server-Side Request Forgery (SSRF), open reverse proxy bypasses, and unauthorized
    metadata access.
  cost: free
  access: public
  archive_url: null
  version_context: null
  verification:
    status: content-reviewed
    checked_on: '2026-10-03'
    method: webfetch
    scope: Relevant English IMDSv2 configuration and security sections inspected; no cloud instances modified.
    evidence: >-
      The inspected AWS documentation contrasts IMDSv1 with session-oriented IMDSv2, details the
      mandatory PUT request to /latest/api/token requiring X-aws-ec2-metadata-token-ttl-seconds,
      explains rejection of PUT requests with X-Forwarded-For headers, details the default IP hop
      limit of 1 to prevent container/proxy traversal, and documents enforcement options that require IMDSv2.
  provenance:
    origin: additional-research
